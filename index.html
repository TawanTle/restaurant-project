<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการร้านอาหารตามสั่ง</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#182a25;background:#f5f7f5}*{box-sizing:border-box}body{margin:0}header{background:#145b46;color:white;padding:18px max(20px,calc((100vw - 1120px)/2))}header h1{margin:0;font-size:1.5rem}main{max-width:1120px;margin:auto;padding:24px 18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button{border:0;border-radius:9px;background:#145b46;color:white;padding:10px 15px;cursor:pointer;font:inherit}button.secondary{background:#e4efea;color:#145b46}button:hover{filter:brightness(.93)}section{background:#fff;border:1px solid #dde5e0;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px #163d260a}h2{margin:0 0 16px;font-size:1.25rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-size:.9rem;font-weight:600}input,select,textarea{display:block;width:100%;padding:10px;border:1px solid #b9c9bf;border-radius:8px;font:inherit;margin-top:5px;background:white}textarea{min-height:42px}form button{margin-top:15px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:590px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5eae7}th{background:#f0f6f2}td button{padding:6px 10px}.muted{color:#5d6d63}.hidden{display:none}#message{min-height:26px;color:#a33126;font-weight:600}.pill{display:inline-block;background:#e5f2e9;border-radius:20px;padding:3px 9px}#cartRows{display:grid;gap:10px}.itemrow{display:grid;grid-template-columns:2fr 90px 1fr auto;gap:8px;align-items:end}@media(max-width:650px){.itemrow{grid-template-columns:1fr 80px}.itemrow button{margin-top:0}section{padding:15px}}
</style></head><body><header><h1>ครัวตามสั่ง · จัดการออเดอร์</h1></header><main><nav><button class="secondary" onclick="show('orders')">ออเดอร์</button><button class="secondary" onclick="show('menus')">เมนูอาหาร</button><button class="secondary" onclick="show('customers')">ลูกค้า</button></nav><p id="message" role="status"></p>
<div id="orders"><section><h2>รับออเดอร์ใหม่</h2><form id="orderForm"><div class="grid"><label>ลูกค้า (ไม่บังคับ)<select name="customer_id" id="orderCustomer"></select></label><label>พนักงานรับออเดอร์<select name="employee_id" id="orderEmployee" required></select></label><label>ประเภทออเดอร์<select name="order_type"><option>ทานที่ร้าน</option><option>กลับบ้าน</option></select></label><label>หมายเหตุออเดอร์<input name="note" placeholder="เช่น รับก่อนเที่ยง"></label></div><h3>รายการอาหาร</h3><div id="cartRows"></div><button type="button" class="secondary" onclick="addItem()">+ เพิ่มรายการอาหาร</button><br><button type="submit">บันทึกออเดอร์</button></form></section><section><h2>ออเดอร์ทั้งหมด</h2><div class="scroll"><table><thead><tr><th>เลขที่ / เวลา</th><th>ลูกค้า</th><th>รายการอาหาร</th><th>ยอดรวม</th><th>สถานะ</th></tr></thead><tbody id="orderTable"></tbody></table></div></section></div>
<div id="menus" class="hidden"><section><h2>เพิ่ม / แก้ไขเมนู</h2><form id="menuForm"><input type="hidden" name="menu_id"><div class="grid"><label>ชื่อเมนู<input name="menu_name" required></label><label>หมวดหมู่<select name="category_id" id="menuCategory" required></select></label><label>ราคา (บาท)<input name="price" type="number" min="0" step="0.01" required></label><label>การจำหน่าย<select name="is_available"><option value="1">พร้อมขาย</option><option value="0">หยุดขาย</option></select></label></div><button>บันทึกเมนู</button> <button type="reset" class="secondary">ล้างฟอร์ม</button></form></section><section><h2>เมนูทั้งหมด</h2><div class="scroll"><table><thead><tr><th>ชื่อเมนู</th><th>หมวดหมู่</th><th>ราคา</th><th>สถานะ</th><th>แก้ไข</th></tr></thead><tbody id="menuTable"></tbody></table></div></section></div>
<div id="customers" class="hidden"><section><h2>เพิ่ม / แก้ไขลูกค้า</h2><form id="customerForm"><input type="hidden" name="customer_id"><div class="grid"><label>ชื่อลูกค้า<input name="customer_name" required></label><label>เบอร์โทร<input name="phone" type="tel"></label></div><button>บันทึกลูกค้า</button> <button type="reset" class="secondary">ล้างฟอร์ม</button></form></section><section><h2>ลูกค้าทั้งหมด</h2><div class="scroll"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>โทรศัพท์</th><th>แก้ไข</th></tr></thead><tbody id="customerTable"></tbody></table></div></section></div>
</main><script>
let data={};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(name){for(const n of ['orders','menus','customers'])$(n).classList.toggle('hidden',n!==name);$('message').textContent=''}
const money=n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function options(xs,key,label,blank=''){return (blank?`<option value="">${blank}</option>`:'')+xs.map(x=>`<option value="${x[key]}">${esc(x[label])}</option>`).join('')}
function addItem(){const available=data.menus.filter(m=>m.is_available);if(!available.length){$('message').textContent='ยังไม่มีเมนูที่พร้อมขาย';return}const div=document.createElement('div');div.className='itemrow';div.innerHTML=`<label>เมนู<select class="itemMenu">${available.map(m=>`<option value="${m.menu_id}">${esc(m.menu_name)} · ${money(m.price)} บาท</option>`).join('')}</select></label><label>จำนวน<input class="itemQty" type="number" min="1" value="1" required></label><label>หมายเหตุ<input class="itemNote" placeholder="เช่น ไม่เผ็ด"></label><button type="button" class="secondary">ลบ</button>`;div.querySelector('button').onclick=()=>div.remove();$('cartRows').append(div)}
async function refresh(){const r=await fetch('/api/data');if(!r.ok)throw Error('อ่านข้อมูลไม่สำเร็จ');data=await r.json();$('orderCustomer').innerHTML=options(data.customers,'customer_id','customer_name','ลูกค้าทั่วไป');$('orderEmployee').innerHTML=options(data.employees,'employee_id','employee_name');$('menuCategory').innerHTML=options(data.categories,'category_id','category_name');$('customerTable').innerHTML=data.customers.map(c=>`<tr><td>${c.customer_id}</td><td>${esc(c.customer_name)}</td><td>${esc(c.phone||'—')}</td><td><button class="secondary" onclick="editCustomer(${c.customer_id})">แก้ไข</button></td></tr>`).join('')||'<tr><td colspan="4">ยังไม่มีลูกค้า</td></tr>';
$('menuTable').innerHTML=data.menus.map(m=>`<tr><td>${esc(m.menu_name)}</td><td>${esc(m.category_name)}</td><td>${money(m.price)}</td><td>${m.is_available?'พร้อมขาย':'หยุดขาย'}</td><td><button class="secondary" onclick="editMenu(${m.menu_id})">แก้ไข</button></td></tr>`).join('')||'<tr><td colspan="5">ยังไม่มีเมนู</td></tr>';
$('orderTable').innerHTML=data.orders.map(o=>{const lines=data.items.filter(i=>i.order_id===o.order_id).map(i=>`${esc(i.menu_name)} × ${i.quantity}${i.item_note?' ('+esc(i.item_note)+')':''}`).join('<br>');return `<tr><td>#${o.order_id}<br><span class="muted">${esc(o.ordered_at)}</span></td><td>${esc(o.customer_name||'ลูกค้าทั่วไป')}<br><span class="muted">${esc(o.order_type)}</span></td><td>${lines}</td><td>${money(o.total)} บาท</td><td><select aria-label="สถานะออเดอร์ ${o.order_id}" onchange="setStatus(${o.order_id},this.value)">${['รับออเดอร์','กำลังทำ','เสร็จแล้ว','ยกเลิก'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`}).join('')||'<tr><td colspan="5">ยังไม่มีออเดอร์</td></tr>'}
async function send(path,payload){try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await r.json();if(!r.ok)throw Error(body.error||'บันทึกไม่สำเร็จ');await refresh();$('message').textContent='บันทึกข้อมูลแล้ว';$('message').style.color='#145b46';return true}catch(e){$('message').textContent=e.message;$('message').style.color='#a33126';return false}}
function editCustomer(id){const c=data.customers.find(x=>x.customer_id===id),f=$('customerForm');f.elements.customer_id.value=id;f.elements.customer_name.value=c.customer_name;f.elements.phone.value=c.phone||'';show('customers');f.scrollIntoView({behavior:'smooth'})}
function editMenu(id){const m=data.menus.find(x=>x.menu_id===id),f=$('menuForm');for(const k of ['menu_id','menu_name','price','category_id','is_available'])f.elements[k].value=m[k];show('menus');f.scrollIntoView({behavior:'smooth'})}
async function setStatus(id,status){await send('/api/order-status',{order_id:id,status})}
$('customerForm').onsubmit=async e=>{e.preventDefault();const f=e.target;if(await send('/api/customers',Object.fromEntries(new FormData(f))))f.reset()};$('menuForm').onsubmit=async e=>{e.preventDefault();const f=e.target;if(await send('/api/menus',Object.fromEntries(new FormData(f))))f.reset()};$('orderForm').onsubmit=async e=>{e.preventDefault();const f=e.target;const items=[...document.querySelectorAll('.itemrow')].map(row=>({menu_id:row.querySelector('.itemMenu').value,quantity:row.querySelector('.itemQty').value,item_note:row.querySelector('.itemNote').value}));if(await send('/api/orders',{...Object.fromEntries(new FormData(f)),items})){f.reset();$('cartRows').replaceChildren();addItem()}};
refresh().then(addItem).catch(e=>{$('message').textContent=e.message});
</script></body></html>
